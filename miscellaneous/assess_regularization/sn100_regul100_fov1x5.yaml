---
resources:
    # model: ../../data/models/tmpWzZ2t1
    # model: ../../data/models/XSL_SSP_PC_Kroupa/Kroupa
    model: ../data/models/miles_Padova00_UN_baseFe_v10.0
    observation: ../data/

common:
    normalization: [5450, 5550]

observation:
    class: Muse
    obs_name: fov_sample_1_5     # should not include extensions in the name
    redshift: 0.004951
    spectral_mask: [
        [6258, 6280],      # Unknown emission 
        [6325, 6345],      # Unknown emission
        [9020, 9060]]      # Noisy
    fixed_spectral_mask: [
        [4855.3, 4867.4],  # 4861.33 Hb         (750 km/s)
        [4952.7, 4965.1],  # 4958.91 [O III]    (750 km/s)
        [5000.6, 5013.1],  # 5006.84 [O III]    (750 km/s)
        [5191.1, 5204.1],  # 5197.58 Fe II      (750 km/s)
        [5193.8, 5206.8],  # 5200.26 [N I]      (750 km/s)
        [5868.3, 5883.0],  # 5875.62 He I       (750 km/s)
        [6292.4, 6308.2],  # 6300.30 [O I]      (750 km/s)
        [6355.8, 6371.7],  # 6363.78 [O I]      (750 km/s)
        [6539.9, 6556.2],  # 6548.05 [N II]     (750 km/s)
        [6554.6, 6571.0],  # 6562.82 Ha         (750 km/s)
        [6575.2, 6591.7],  # 6583.46 [N II]     (750 km/s)
        [6708.0, 6724.8],  # 6716.44 [S II]     (750 km/s)
        [6722.4, 6739.2],  # 6730.81 [S II]     (750 km/s)
        [9057.3, 9080.0],  # 9068.60 [S III]    (750 km/s)

        [4717.1, 4736.1],  # 4750.00 Nominal start  (3*sigma_star ~ 600 km/s)
        [9285.3, 9322.6],  # 9350.00 Nominal end    (3*sigma_star ~ 600 km/s)

        [7553.0, 7575.0],  # Noisy region
        [7587.0, 7620.0]]  # Noisy region
    snr:
        window: [5450, 5550]
        min: 3
         
model:
    # class_: XSLAgeMh
    class_: MilesAgeMh
    remove:
        age_range: [15.8489]         # Must be a list, can be empty
        mh_range: []                 # Must be a list, can be empty
    convolve: True
    
ppxf:                         # This execution is mandatory 
    moments : 4
    degree : -1
    mdegree : 10
    velscale_ratio : 2        # Must keep this parameter in additional iterations, with the same value

ppxf_dynamical_mask:          # This execution is optional (the block can be commented or deleted)
    moments : 4
    degree : -1
    mdegree : 10
    velscale_ratio : 2

ppxf_fixed_kinematics:        # This execution is optional (the block can be commented or deleted)
    moments : 4
    degree : -1
    mdegree : 8
    regul : 100               # 1/Delta
    velscale_ratio : 2        # Must keep this parameter in additional iterations, with the same value
    fixed: [1,1,1,1]          # See *fixed* keyword in the pPXF documentation
        
ppxf_refit:
    mask:
        sigma : 2.5

output:
    output_root : ../data_products/regularization
    to_save : ['bestfit', 'chi2', 'error', 'reddening', 'sol',
        'weights']
    secondary : mean_log_age, mean_mh   

vorbin:
    apply: True
    target_sn: 100
