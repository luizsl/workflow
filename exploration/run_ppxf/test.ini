[resources]
;model = ../../data/models/tmpWzZ2t1/Mku1.30Z*.fits
model = ../../data/models/XSL_SSP_PC_Kroupa/Kroupa
observation = ../../data/toy_100x100.fits

[observation]
obs_name = toy_100x100
redshift = 0.004951
sampling = linear

[model]
;model_name = miles
model_name = xsl
# remove leading and trailing zeros (in angstrom)
wave_trim = 0 1.5
lsf = 2.51
sampling = log

[ppxf]
moments = 4
degree = 12
clean = True
plot = True

[output]
output_root = ../../data_products/
output_dir = ${observation:obs_name}/
