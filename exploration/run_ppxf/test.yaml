---
resources:
    model: ../../data/models/EMILES_BASTI_BASE_KB_FITS
    observation: ../../data/

common:
    n_process: 4

observation:
    class: Muse
    obs_name: fov_sample_1_5     # should not include extensions in the name
    redshift: 0.004951
    spectral_mask: [
        # [<lower>, <upper>],
        ]
    fixed_spectral_mask: [
        # [<lower>, <upper>],
        ]
    snr:
        window: [5450, 5550]
        min: 3
    # normalization: [<lower>, <upper>]
    # trim: [<lower>, <upper>]

model:
    class_: MilesAgeMh
    remove:
        age_range: []         # Must be a list, can be empty
        mh_range: []          # Must be a list, can be empty
    convolve: True
    weighting: light          # light or mass
    # age_log10: True
    # age_gyr: False
    # normalization: [<lower>, <upper>]
    # trim: [<lower>, <upper>]

ppxf_optimise_mask:           # This execution is optional (the block can be commented or deleted)
    moments: 4
    degree: 8
    mdegree: -1

ppxf_fit_reddening:           # This execution is optional (the block can be commented or deleted)
    moments: 4
    degree: -1
    mdegree: -1
    reddening: 0
    # fixed: [1,1,1,1]          # See *fixed* keyword in the pPXF documentation

ppxf_kinematics:              # This execution is optional (the block can be commented or deleted)
    moments: 4
    degree: 8
    mdegree: -1

ppxf_regularization:          # This execution is optional (the block can be commented or deleted)
    moments: 4
    degree: -1
    mdegree: 8
    regul: 0                  # 1/Delta

ppxf_refit:
    mask:
        sigma: 3

output:
    output_root: ../../data_products/
    to_save: ['bestfit', 'chi2', 'error', 'reddening', 'sol',
        'weights', 'goodpixels', 'galaxy', 'noise',
        'a_v', 'ebv']

vorbin:
    apply: True
    target_sn: 200
    covar_sn_a: 0             # beta(N) = 1 + a * (log_10 N)^b
    covar_sn_b: 1
