---
resources:
    # model: ../../data/models/tmpWzZ2t1
    # model: ../../data/models/XSL_SSP_PC_Kroupa/Kroupa
    model: ../../data/models/miles_Padova00_UN_baseFe_v10.0
    observation: ../../data/

observation:
    class: Muse
    obs_name: fov_sample_1_5     # should not include .fits extension in the name
    redshift: 0.004951
    sampling: linear
    spectral_mask : [
        [4000, 4770],
        [4850, 4880],
        [4950, 4970], 
        [4990, 5025],
        [5190, 5210],
        [6250, 6380],
        [6530, 6600],
        [6700, 6750],
        [7560, 7610],
        [8710, 8725],
        [9000, 9500]]
        
model:
    # class_: XSLAgeMh
    class_: MilesAgeMh
    remove:
        age_range: [10.2]          # Must be a list
        mh_range: [-0.1 0.1]
    resolving_power: 10000
    sampling: log
#    remove:
#        age_range: [10.2]         # Must be a list
#        mh_range: [-0.1 0.1]    

ppxf:
    moments : 4
    degree : -1 
    mdegree : -1
    clean : False
    regul : 0  # 1/Delta
    reddening : 0
    velscale_ratio : 2
    quiet : False

ppxf_refit:
    apply : False
    sigma : 2.3
    
output:
    output_root : ../../data_products/
    to_save : ['bestfit', 'chi2', 'error', 'reddening', 'sol',
        'weights', 'goodpixels']

vorbin:
    apply: True
    sn: 100
    min: 4

