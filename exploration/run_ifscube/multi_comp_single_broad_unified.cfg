[fit]
fit_continuum: yes
fitting_window: 4780e-10:7405e-10
function: gaussian
guess_parameters: yes
optimize_fit: no
overwrite: yes
refit: yes
bounds_change: 0.5, 50, 20
refit_radius: 2
spiral_center: cofm 
spiral_loop: yes
suffix: _linefit
test_jacobian: yes
verbose: yes
write_fits: yes
method = slsqp

[loading]
primary: PRIMARY
scidata: SCI
variance: ERR
;spatial_mask: MASK
stellar: STELLAR

[minimization]
eps: 1e-8
ftol: 1e-10
disp: yes
maxiter: 1000

[continuum]
degree: 3
n_iterate: 4
lower_threshold: 2
upper_threshold: 2
line_weight: 0.0

[equivalent_width]
sigma_factor: 3

