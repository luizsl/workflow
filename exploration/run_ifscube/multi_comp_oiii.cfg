[fit]
fit_continuum: yes 
fitting_window: 4900e-10:5170e-10
function: gaussian
guess_parameters: yes
optimize_fit: no
optimization_window: 2
overwrite: yes
refit: no
bounds_change: 2, 50, 30
refit_radius: 2
spiral_center: cofm 
spiral_loop: yes
suffix: _linefit
test_jacobian: yes
#trivial: no
verbose: yes
write_fits: yes
method = slsqp

[loading]
primary: PRIMARY
scidata: SCI
variance: ERR
spatial_mask: MASK
stellar: STELLAR

[minimization]
eps: 1e-8
ftol: 1e-10
disp: yes
maxiter: 1000

[continuum]
degree: 1
n_iterate: 4
lower_threshold: 2
upper_threshold: 2
line_weight: 0.0

[equivalent_width]
sigma_factor: 3

######################     [OIII] narrow   ###########################

[oiii_4958_narrow]
rest_wavelength: 4958.91e-10
amplitude: median, 0:
velocity: 0, +- 100
sigma: 100, 60:140
continuum_windows: 4900e-10, 4950e-10, 5065e-10, 5170e-10
k_group: 0

[oiii_5007_narrow]
rest_wavelength: 5006.843e-10
amplitude: median, 0:, oiii_4958_narrow.amplitude * 3
k_group: 0

######################     [OIII] broad ###########################

;[oiii_4958_broad]
;rest_wavelength: 4958.91e-10
;amplitude: median, 0:
;velocity: 1480, +- 400, > oiii_4958_narrow.velocity + 100
;sigma: 250, 150:400, > oiii_4958_narrow.sigma
;continuum_windows: 4900e-10, 4950e-10, 5065e-10, 5170e-10
;k_group: 1

;[oiii_5007_broad]
;rest_wavelength: 5006.843e-10
;amplitude: median, 0:, oiii_4958_broad.amplitude * 3
;k_group: 1

