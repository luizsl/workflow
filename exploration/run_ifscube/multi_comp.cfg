[fit]
fit_continuum: yes
fitting_window: 4780e-10:7405e-10
function: gaussian
guess_parameters: yes
optimize_fit: no
optimization_window: 2
overwrite: yes
#individual_spec: 39, 28
refit: yes
bounds_change: 2, 40, 30
refit_radius: 2
spiral_center: cofm 
spiral_loop: yes
suffix: _linefit
test_jacobian: no
#trivial: no
verbose: yes
write_fits: yes
method = slsqp

[loading]
primary: PRIMARY
scidata: SCI
variance: ERR
spatial_mask: MASK
stellar: STELLAR

[minimization]
eps: 1e-3
ftol: 1e-8
disp: yes
maxiter: 1000

[continuum]
degree: 5
n_iterate: 4
lower_threshold: 1
upper_threshold: 1
line_weight: 0.0

[equivalent_width]
sigma_factor: 3

